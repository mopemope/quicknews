# Shared sample config for development and Codex tasks.
# Do not put real secrets in this file.

db = "/tmp/quicknews.db"
speaking_rate = 1.3
require_confirm = true
save_audio_data = false
enable_env_override = false
use_gemini_tts = false

# Optional export directory for Org mode.
export_org = ""

# Optional audio output directory.
audio = "/tmp/quicknews-audio"

# Optional Gemini settings.
gemini_api_key = ""
gemini_model = "gemini-2.5-flash"

# Summarizer provider: "gemini" (default) or "openai".
summarize_provider = "gemini"

# Optional OpenAI settings (used when summarize_provider = "openai").
openai_api_key = ""
openai_model = "gpt-5-mini"
# openai_base_url = "" # Override for OpenAI-compatible endpoints (e.g., Azure, OpenRouter).

# Optional Google TTS credentials path.
google_application_credentials = ""

[voicevox]
speaker = 10
style = 1
# VoiceVox engine endpoint (default: http://localhost:50021).
endpoint = "http://localhost:50021"

[prompt]
summary = ""

[cloudflare]
access_key_id = ""
secret_access_key = ""
bucket_name = ""
endpoint_url = ""

[podcast]
channel_title = "quicknews"
channel_link = "https://example.com/podcast"
channel_desc = "quicknews podcast feed"
author = "quicknews"
publish_url = "https://example.com/podcast"
