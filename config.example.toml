# Shared sample config for development and Codex tasks.
# Do not put real secrets in this file.

db = "/tmp/quicknews.db"
speaking_rate = 1.3
require_confirm = true
save_audio_data = false
enable_env_override = false
use_gemini_tts = false

# Optional export directory for Org mode.
export_org = ""

# Optional audio output directory.
audio = "/tmp/quicknews-audio"

# Optional Gemini settings.
gemini_api_key = ""
gemini_model = "gemini-2.5-flash"

# Optional Google TTS credentials path.
google_application_credentials = ""

[voicevox]
speaker = 10
style = 1

[prompt]
summary = ""

[cloudflare]
access_key_id = ""
secret_access_key = ""
bucket_name = ""
endpoint_url = ""

[podcast]
channel_title = "quicknews"
channel_link = "https://example.com/podcast"
channel_desc = "quicknews podcast feed"
author = "quicknews"
publish_url = "https://example.com/podcast"
