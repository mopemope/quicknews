name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GOCACHE: /tmp/quicknews-go-build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: Run tests
        run: make test-all
      - name: Smoke config
        run: make smoke-config
